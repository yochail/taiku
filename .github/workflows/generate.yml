name: Daily feed

# Multi-site: one matrix leg per site pack with generation on (node scripts/sites.mjs --generate), run one
# at a time because the sites share the LLM quota. Per-site call cap: repo variable GEN_MAX_CALLS_<SITE>
# (e.g. GEN_MAX_CALLS_TARYA), else GEN_MAX_CALLS.
#
# Local-first: a local generation script writes sites/<site>/content/posts/daily-<UTC date>.json (origin "local",
# provider "local") and pushes it to main around 09:00 UTC. This workflow is the FALLBACK:
# at 12:00 UTC (GitHub may start it hours late) it exits early, green, when that file is already on main
# (checked against main as it is when the leg runs, and again before publishing), otherwise it runs the
# Cloudflare Workers AI pipeline and writes the same filename with origin "cloudflare".
#
# Quota days are not failures: when generation ends partial (free-tier LLM quotas exhausted, below
# GEN_MIN_COMPLETE, wall clock) scripts/ci-generate.sh emits a ::warning:: and a job summary, and the
# site is skipped (nothing published) with the job green. The same holds when generation or the repair
# dies on a quota / rate-limit error, and when the day gate still fails after a repair that was quota-
# or rate-limited (429s, capped models, budget hit: scripts/ci-quota.mjs). Real errors still fail:
# exceptions, invalid output, missing credentials, and a day gate that fails after an unlimited repair.
#
# Distribution gate: the day's file must pass `npm run realism -- --file <day file>` (realism/spec.json,
# bands widened for one day's sample, hard checks, per-persona plausibility). On failure the flagged
# items are regenerated once (`generate --repair`), then the gate runs again and blocks: a failing
# day fails the job, so `publish` never runs and nothing is committed.
#
# Security split: `generate` talks to Workers AI + feeds with a read-only token and no persisted git
# credentials; `publish` never sees the AI token, only re-validates the generated JSON and pushes it.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (blank = today, UTC)"
        default: ""
      nonce:
        description: "Run nonce: replay a logged one or re-roll the day (blank = derived from date + seed)"
        default: ""
      topics:
        description: "Topics this run (3-5, blank = budget plan)"
        default: ""
      max_calls:
        description: "LLM request ceiling incl. tool rounds and retries (blank = GEN_MAX_CALLS or 1000)"
        default: ""
      force:
        description: "Run even if the local daily file exists (writes daily-<date>-cf.json next to it)"
        type: boolean
        default: false
      mock:
        description: "Mock provider + offline fixtures (writes -mock files, never published)"
        type: boolean
        default: false

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        run: echo "list=$(node scripts/sites.mjs --generate --json)" >> "$GITHUB_OUTPUT"

  generate:
    needs: sites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Secrets live in the `production` environment (restricted to main).
    environment: production
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.list) }}
    env:
      SITE: ${{ matrix.site }}
      GEN_USAGE_FILE: ${{ github.workspace }}/_scratch/free-budget.json
      CF_FREE_ONLY: ${{ vars.CF_FREE_ONLY }}
      GROQ_FREE_ONLY: ${{ vars.GROQ_FREE_ONLY }}
      GEMINI_FREE_ONLY: ${{ vars.GEMINI_FREE_ONLY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Local run present?
        id: local
        env:
          GEN_DATE: ${{ inputs.date }}
          IN_NONCE: ${{ inputs.nonce }}
          IN_TOPICS: ${{ inputs.topics }}
          IN_MAX_CALLS: ${{ inputs.max_calls }}
          FORCE: ${{ inputs.force && '1' || '' }}
          MOCK: ${{ inputs.mock && '1' || '' }}
        run: |
          # Free-text dispatch inputs: allowlist before anything uses them.
          bad() { echo "::error::invalid input $1"; exit 1; }
          [ -z "$GEN_DATE" ] || [[ "$GEN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || bad date
          [ -z "$IN_NONCE" ] || [[ "$IN_NONCE" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || bad nonce
          [ -z "$IN_TOPICS" ] || [[ "$IN_TOPICS" =~ ^[0-9]{1,2}$ ]] || bad topics
          [ -z "$IN_MAX_CALLS" ] || [[ "$IN_MAX_CALLS" =~ ^[0-9]{1,5}$ ]] || bad max_calls
          [[ "$SITE" =~ ^[a-z0-9_-]+$ ]] || bad site
          day="${GEN_DATE:-$(date -u +%Y-%m-%d)}"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          # The file this run owns: -mock in mock mode, -cf when --force runs next to a local file.
          sfx=""
          if [ -n "$MOCK" ]; then sfx="-mock"
          elif [ -n "$FORCE" ] && [ -f "sites/$SITE/content/posts/daily-$day.json" ] && ! grep -q '"origin": *"cloudflare"' "sites/$SITE/content/posts/daily-$day.json"; then sfx="-cf"; fi
          echo "dayfile=sites/$SITE/content/posts/daily-$day$sfx.json" >> "$GITHUB_OUTPUT"
          # The local run may have pushed after this run was queued: look at main as it is now, not just the checkout.
          f="sites/$SITE/content/posts/daily-$day.json"
          onmain=""
          if [ -f "$f" ]; then onmain=1
          elif git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME" 2>/dev/null && git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then onmain=1; fi
          if [ -z "$MOCK" ] && [ -z "$FORCE" ] && [ -n "$onmain" ]; then
            echo "::notice::local run present on main, skipping the fallback ($f)"
            echo "Daily feed fallback for \`$SITE\` $day: skipped, the local run already published \`$f\`." >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore shared free-provider usage
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/free-budget-sync.mjs

      - name: Share remaining allowance fairly
        run: echo "GEN_REMAINING_SITES=${{ steps.budget.outputs.remaining }}" >> "$GITHUB_ENV"

      # The site build is zero-dependency. The generate step optionally uses MiniLM embeddings
      # (@huggingface/transformers, optionalDependency); a failed install just degrades to tag overlap.
      # Supply chain: exact versions from package-lock.json, no install scripts (no secrets in this step either),
      # and the model is pinned to a Hugging Face commit (MODEL_REVISION in src/lib/embed.mjs) that keys the cache.
      - name: Model revision
        id: hf
        if: steps.local.outputs.skipped != 'true'
        run: echo "rev=$(node -e "import('./src/lib/embed.mjs').then(m=>console.log(m.MODEL_REVISION))")" >> "$GITHUB_OUTPUT"
      - name: Cache embedding model
        if: steps.local.outputs.skipped != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/taiku-hf
          key: hf-minilm-l6-v2-${{ runner.os }}-${{ steps.hf.outputs.rev }}
      - name: Install optional embeddings
        if: steps.local.outputs.skipped != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund || echo "embeddings unavailable; the run falls back to tag overlap (degraded)"

      - name: Generate the daily run (Workers AI fallback)
        id: gen
        if: steps.local.outputs.skipped != 'true'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEN_DATE: ${{ steps.local.outputs.day }}
          GEN_NONCE: ${{ inputs.nonce }}
          GEN_TOPICS: ${{ inputs.topics || vars.GEN_TOPICS }}
          GEN_MAX_CALLS: ${{ inputs.max_calls || vars[format('GEN_MAX_CALLS_{0}', matrix.site)] || vars.GEN_MAX_CALLS }}
          GEN_MIN_COMPLETE: ${{ vars.GEN_MIN_COMPLETE }}
          # GIPHY beta key: server-side search only (rating=pg-13), capped per run.
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          GIPHY_MAX_CALLS: ${{ vars.GIPHY_MAX_CALLS || '10' }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          POLICY_ALLOW_NAMES: ${{ vars.POLICY_ALLOW_NAMES }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          FORCE: ${{ inputs.force && '1' || '' }}
          MOCK: ${{ inputs.mock && '1' || '' }}
          DAYFILE: ${{ steps.local.outputs.dayfile }}
        # Partial (quota exhausted / below GEN_MIN_COMPLETE) → warning + summary, soft=true, nothing published.
        run: bash scripts/ci-generate.sh

      - name: Day gate (distribution)
        id: gate
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true'
        continue-on-error: true
        env:
          DAYFILE: ${{ steps.local.outputs.dayfile }}
        run: npm run realism -- --file "$DAYFILE" --json day-gate.json
      - name: Repair once (regenerate the flagged items)
        id: repair
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.gate.outcome == 'failure'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEN_DATE: ${{ steps.local.outputs.day }}
          GEN_NONCE: ${{ inputs.nonce }}
          GEN_TOPICS: ${{ inputs.topics || vars.GEN_TOPICS }}
          GEN_MAX_CALLS: ${{ inputs.max_calls || vars[format('GEN_MAX_CALLS_{0}', matrix.site)] || vars.GEN_MAX_CALLS }}
          GEN_MIN_COMPLETE: ${{ vars.GEN_MIN_COMPLETE }}
          # GIPHY beta key: server-side search only (rating=pg-13), capped per run.
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          GIPHY_MAX_CALLS: ${{ vars.GIPHY_MAX_CALLS || '10' }}
          NEWS_FEEDS: ${{ vars.NEWS_FEEDS }}
          POLICY_ALLOW_NAMES: ${{ vars.POLICY_ALLOW_NAMES }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          FORCE: ${{ inputs.force && '1' || '' }}
          MOCK: ${{ inputs.mock && '1' || '' }}
          DAYFILE: ${{ steps.local.outputs.dayfile }}
        run: bash scripts/ci-generate.sh --repair
      - name: Day gate after repair (blocking; a failure means nothing is committed)
        id: regate
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.gate.outcome == 'failure' && steps.repair.outputs.soft != 'true'
        env:
          DAYFILE: ${{ steps.local.outputs.dayfile }}
          REPAIR_QUOTA: ${{ steps.repair.outputs.quota }}
        run: |
          npm run realism -- --file "$DAYFILE" --json day-gate.json && exit 0
          # Still off-band. If the repair was quota- or rate-limited (budget hit, 429s, capped models: the
          # flagged items could not all be regenerated) that is a quota day, not a defect: skip publishing
          # with a warning. Otherwise the gate blocks.
          if [ "$REPAIR_QUOTA" = "true" ]; then
            why="$(head -c 500 gen-meta/quota-repair.txt 2>/dev/null || echo 'LLM quota / rate limits')"
            echo "::warning title=Daily feed fallback skipped ($SITE)::the day gate still fails after repair and the repair was quota- or rate-limited ($why); nothing is published for $SITE."
            printf '%s\n' "### Daily feed fallback: \`$SITE\` skipped" "" "The day gate still failed after \`--repair\`, which was limited by free-tier LLM quotas / rate limits. Nothing was published; see day-gate.json in the artifact." "" "- Rate / quota limits: $why" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p gen-meta && printf 'gate-after-repair (quota: %s)\n' "$why" > gen-meta/skipped.txt
            echo "soft=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error title=Day gate failed ($SITE)::the day gate still fails after repair and the repair was not quota-limited; nothing is published."
          exit 1

      - name: Validate content
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.repair.outputs.soft != 'true' && steps.regate.outputs.soft != 'true'
        run: npm run validate
      - name: Build, checks & unit tests
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.repair.outputs.soft != 'true' && steps.regate.outputs.soft != 'true'
        run: if [ "$SITE" = "taiku" ]; then SITE= npm test; else npm run build; fi
      - name: Realism report, whole corpus (non-blocking)
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.repair.outputs.soft != 'true' && steps.regate.outputs.soft != 'true'
        continue-on-error: true
        run: npm run realism

      - name: Record the day file for publish
        if: steps.local.outputs.skipped != 'true' && steps.gen.outputs.soft != 'true' && steps.repair.outputs.soft != 'true' && steps.regate.outputs.soft != 'true'
        env:
          DAYFILE: ${{ steps.local.outputs.dayfile }}
        run: mkdir -p gen-meta && printf '%s\n' "$DAYFILE" > gen-meta/dayfile.txt
      - name: Upload generated content
        if: always() && steps.local.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ matrix.site }}
          path: |
            gen-meta/
            sites/${{ matrix.site }}/content/
            sites/${{ matrix.site }}/staging/
            day-gate.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist shared usage even when generation or gate fails
        if: always() && steps.budget.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: free-budget-${{ steps.budget.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.site }}
          path: _scratch/free-budget.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [sites, generate]
    if: always() && needs.sites.result == 'success' && vars.PUBLISH_ENABLED != 'false' && !inputs.mock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.sites.outputs.list) }}
    env:
      SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No artifact = this site skipped (local run present) or its generate leg failed: nothing to publish.
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true
        with:
          name: daily-content-${{ matrix.site }}
          path: .

      # The artifact uploads even when generation failed (always()), but then without gen-meta/dayfile.txt
      # or the day file itself: skip this site with a clear error instead of tripping the allowlist below.
      - name: Generated day file present?
        id: have
        if: steps.dl.outcome == 'success'
        run: |
          DAYFILE="$(head -n1 gen-meta/dayfile.txt 2>/dev/null || true)"
          if [ -f gen-meta/skipped.txt ]; then
            echo "::notice::generate (${SITE}) skipped publishing: $(head -n1 gen-meta/skipped.txt)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DAYFILE" ] || [ ! -f "$DAYFILE" ]; then
            echo "::error::generate (${SITE}) produced no day file${DAYFILE:+ ($DAYFILE missing)}; nothing to publish for $SITE. See the generate job log."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [[ "$DAYFILE" != *-cf.json ]] && git fetch --quiet --depth=1 origin "$GITHUB_REF_NAME" 2>/dev/null && git cat-file -e "FETCH_HEAD:$DAYFILE" 2>/dev/null; then
            # The local run landed on main while this fallback was generating: it wins, never clobber it.
            echo "::notice::$DAYFILE is already on main (local run pushed meanwhile); not publishing the fallback for $SITE."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-validate before publishing
        if: steps.dl.outcome == 'success' && steps.have.outputs.ok == 'true'
        run: |
          DAYFILE="$(head -n1 gen-meta/dayfile.txt)"
          # The artifact is untrusted input here: only this site's day file shape is accepted.
          [[ "$DAYFILE" =~ ^sites/[a-z0-9_-]+/content/posts/daily-[0-9]{4}-[0-9]{2}-[0-9]{2}(-cf)?\.json$ ]] && [[ "$DAYFILE" == "sites/$SITE/"* ]] || { echo "::error::unexpected day file '$DAYFILE'"; exit 1; }
          npm run validate
          if [ "$SITE" = "taiku" ]; then SITE= npm test; else npm run build; fi
          npm run realism -- --file "$DAYFILE"

      - name: Commit & push
        if: steps.dl.outcome == 'success' && steps.have.outputs.ok == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf day-gate.json gen-meta
          git add sites/$SITE/content sites/$SITE/staging 2>/dev/null || git add sites/$SITE/content
          if git diff --cached --quiet; then echo "No new content."; exit 0; fi
          git config user.name "taiku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content($SITE): daily run (cloudflare fallback) $(date -u +%Y-%m-%d)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" pull --rebase origin "${GITHUB_REF_NAME}"
          git -c http.extraheader="$auth" push origin "HEAD:${GITHUB_REF_NAME}"