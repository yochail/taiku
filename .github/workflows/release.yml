# Drip release: a day's posts carry future createdAt times and stay hidden until the site rebuilds
# after that time. This pings the Cloudflare Pages deploy hook every 2 hours so they appear through
# the day, whichever path (local session or the generate.yml fallback) wrote the file.
name: release

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "CF_DEPLOY_HOOK not set; skipping drip rebuild" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$CF_DEPLOY_HOOK")
          echo "deploy hook HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Drip rebuild triggered at $(date -u +%H:%MZ) (HTTP $code)" >> "$GITHUB_STEP_SUMMARY"
          else
            cat resp.json || true
            exit 1
          fi
